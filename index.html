<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PIXI Pong!</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Play PIXI Pong</h1>
      <p>Click the "Play" button below.</p>
      <p id="game-over-text">All 4 sides have been hit!</p>
      <!-- gif from https://giphy.com/explore/game-over -->
      <img src="./gameover.gif" alt="retro game over gif" />
      <div id="the-pong-table"></div>
      <button id="start">Play</button>
    </main>
    <!-- Load in the PixiJS -->
    <script src="https://pixijs.download/release/pixi.min.js"></script>
    <script type="module" src="script.js"></script>
  </body>
</html>
